services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: finsight, POSTGRES_PASSWORD: finsight, POSTGRES_DB: finsight}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: .
    environment: {DATABASE_URL: "postgresql+psycopg://finsight:finsight@db:5432/finsight", SECRET_KEY: "change-me-long-random"}
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
